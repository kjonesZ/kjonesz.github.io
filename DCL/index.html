<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071e35">
<meta name="description" content="The Jones family countdown to Halloween on the High Seas aboard the Disney Dream.">
<title>Halloween on the High Seas Countdown</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#071e35;color:#fff}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 18% 12%,#123b5a 0,#071e35 38%)}main{min-height:100svh;display:grid;grid-template-columns:1fr 1fr}.content{position:relative;overflow:hidden;padding:clamp(28px,6vw,100px);display:flex;flex-direction:column;justify-content:center}.sparkles{position:absolute;top:clamp(22px,5vw,64px);right:clamp(20px,5vw,70px);color:#e9c77c;font-size:clamp(1.1rem,2vw,1.8rem);letter-spacing:.55em;opacity:.8}.eyebrow{color:#e9c77c;text-transform:uppercase;letter-spacing:.22em;font-weight:650;font-size:.875rem;margin:0 0 28px}.rule{width:72px;height:3px;background:linear-gradient(90deg,#e9c77c 0 68%,#c83c49 68%);margin-bottom:32px}h1{font-family:Georgia,serif;font-size:clamp(3rem,6vw,6rem);line-height:1.04;font-weight:400;margin:0 0 22px;letter-spacing:-.035em}h1 em{color:#e9c77c;font-weight:400}.ship-name{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;margin:0 0 16px;padding:9px 14px;border:1px solid #e9c77c66;border-radius:999px;color:#fff;background:#ffffff0b;font-size:.9rem;font-weight:650;letter-spacing:.05em}.ship-name span{color:#e9c77c}.date{font-size:1.125rem;color:#d4e1eb;margin:0 0 36px}.countdown{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;border-block:1px solid #ffffff30;padding:24px 0}.number{display:block;font-size:clamp(1.85rem,3.8vw,3.8rem);font-weight:300;font-variant-numeric:tabular-nums;line-height:1.2}.label{display:block;font-size:.875rem;color:#bccedb;margin-top:8px}.note{font-size:.875rem;color:#bccedb;line-height:1.6;margin:22px 0 0}.photo{position:relative;min-height:480px;overflow:hidden;background:#125c83;border-left:4px solid #c83c49}.photo img{width:100%;height:100%;position:absolute;object-fit:cover;object-position:48% center}.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#071e3500 55%,#071e35d8)}.caption{position:absolute;bottom:34px;left:30px;right:30px;z-index:1;font-size:.8rem;line-height:1.6;color:white;text-shadow:0 1px 4px #000}.caption a{color:inherit;text-underline-offset:3px}#status{color:#e9c77c;font-size:1.125rem;margin-top:24px}#status:empty{display:none}@media(max-width:760px){main{grid-template-columns:1fr}.content{padding:70px 28px 48px}.photo{min-height:340px;order:2;border-left:0;border-top:4px solid #c83c49}h1{font-size:clamp(3.2rem,12vw,5.5rem)}.number{font-size:clamp(2rem,8vw,3.8rem)}.date{margin-bottom:30px}.caption{bottom:20px;left:20px;right:20px}}@media(prefers-reduced-motion:no-preference){.content{animation:arrive .7s ease-out}.sparkles{animation:twinkle 2.4s ease-in-out infinite}@keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes twinkle{50%{opacity:.35;transform:scale(.92)}}}
.halloween-banner{align-self:flex-start;display:flex;align-items:center;gap:12px;margin:0 0 18px;padding:10px 15px;border:1px solid #f49a44a6;border-radius:8px;background:linear-gradient(90deg,#4b2859cc,#2a193ccc);box-shadow:0 8px 24px #0003;color:#ffd8a8;font-family:Georgia,serif;font-size:1rem}.halloween-banner strong{color:#fff;font-weight:600}.halloween-banner span{font-size:1.25rem}.sparkles{color:#f5a34b}.rule{background:linear-gradient(90deg,#f5a34b 0 56%,#8d5bb5 56% 78%,#c83c49 78%)}body{background:radial-gradient(circle at 20% 8%,#45285b 0,#132a49 32%,#071e35 62%)}.photo{border-color:#f08a36}.photo:after{background:linear-gradient(180deg,#24133300 42%,#26143775 67%,#071e35e8)}
.magic-link{display:flex;align-items:center;gap:14px;margin-top:22px;padding:13px 16px;border:1px solid #f5a34b8c;border-radius:12px;background:linear-gradient(100deg,#f08a36,#ca4f35);color:#fff;text-decoration:none;box-shadow:0 10px 26px #0003;transition:transform .2s ease,box-shadow .2s ease}.magic-link:hover{transform:translateY(-2px);box-shadow:0 14px 30px #0005}.magic-link:focus-visible{outline:3px solid #ffd18a;outline-offset:3px}.magic-copy{display:flex;flex:1;flex-direction:column;font-weight:750;line-height:1.25}.magic-copy small{margin-top:3px;font-size:.76rem;font-weight:500;opacity:.85}.magic-arrow{font-size:1.45rem}.mickey-mark{position:relative;display:block;flex:0 0 34px;width:34px;height:30px}.mickey-mark:before,.mickey-mark:after,.mickey-mark span{content:"";position:absolute;display:block;border-radius:50%;background:#fff}.mickey-mark:before{width:14px;height:14px;left:1px;top:0}.mickey-mark:after{width:14px;height:14px;right:1px;top:0}.mickey-mark span{width:23px;height:23px;left:5.5px;bottom:0}@media(max-width:440px){.magic-link{padding:12px}.magic-copy{font-size:.9rem}}
.event-title{margin-bottom:20px}.event-title .event-lead{display:block;margin-bottom:8px;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:.32em;font-weight:750;letter-spacing:.14em;line-height:1.2;text-transform:uppercase}.event-title em{display:block;color:#f5a34b;text-shadow:0 3px 24px #8d5bb577}.date{padding-left:15px;border-left:3px solid #8d5bb5}.countdown{gap:10px;border:0;padding:6px 0}.countdown>div{padding:15px 8px;border:1px solid #ffffff1c;border-radius:10px;background:linear-gradient(145deg,#ffffff0f,#8d5bb50c);box-shadow:inset 0 1px #ffffff12}.countdown>div:nth-child(odd) .number{color:#ffad5c}.countdown>div:nth-child(even) .number{color:#d2a8f0}.content:after{content:"☾";position:absolute;right:-22px;bottom:72px;color:#f5a34b0f;font-family:Georgia,serif;font-size:11rem;line-height:1;pointer-events:none}.sparkles{letter-spacing:.25em}.magic-link{position:relative;z-index:1}
.eyebrow{margin-bottom:9px}.rule{width:170px;margin-bottom:30px}.sparkles{display:flex;align-items:center;gap:9px;letter-spacing:0;opacity:.36;animation:none!important}.sparkles span{color:#f8c779;opacity:.8;text-shadow:0 0 6px #f5a34b55}.sparkles span:nth-child(1),.sparkles span:nth-child(5){font-size:.5em}.sparkles span:nth-child(2){font-size:.82em}.sparkles span:nth-child(3){font-size:1.08em}.sparkles span:nth-child(4){font-size:.64em}.sparkles span:nth-child(6){font-size:.72em}@media(prefers-reduced-motion:no-preference){.sparkles{animation:pixie-fade 4.8s ease-in-out infinite!important}@keyframes pixie-fade{0%,100%{opacity:.18;transform:translateY(1px)}50%{opacity:.48;transform:translateY(-2px)}}}@media(prefers-reduced-motion:reduce){.sparkles{opacity:.32}}
.candy-control{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:11px;margin:18px 0 0}.candy-button{position:relative;width:58px;height:54px;padding:10px 12px;border:1px solid #f5a34b99;border-radius:50%;background:#21152ccc;box-shadow:0 6px 18px #0004;cursor:pointer;transition:transform .2s ease,background .2s ease}.candy-button:hover{transform:scale(1.08);background:#3b2250}.candy-button:active{transform:scale(.96)}.candy-button:focus-visible{outline:3px solid #ffd18a;outline-offset:3px}.candy-button .mickey-mark{margin:auto;transform:scale(1.05)}.candy-button .mickey-mark:before,.candy-button .mickey-mark:after,.candy-button .mickey-mark span{background:#f5a34b}.candy-hint{color:#d8c8e4;font-size:.82rem}.falling-candy{position:fixed;z-index:50;top:-3rem;left:0;pointer-events:none;filter:drop-shadow(0 3px 3px #0005);animation:candy-fall linear forwards;will-change:transform}@keyframes candy-fall{0%{transform:translate3d(0,-8vh,0) rotate(0deg);opacity:0}8%{opacity:1}100%{transform:translate3d(var(--drift),112vh,0) rotate(var(--spin));opacity:.95}}@media(prefers-reduced-motion:reduce){.falling-candy{animation-duration:1.2s!important}.candy-button{transition:none}}
.high-seas-line{display:flex;align-items:center;gap:10px}.event-title .high-seas-line em{display:inline}.candy-button{flex:0 0 auto;width:42px;height:40px;margin:3px 0 0;padding:5px 4px;border-color:transparent;background:transparent;box-shadow:none;opacity:.38;vertical-align:middle;transition:opacity .25s ease,transform .2s ease,background .25s ease}.candy-button:hover,.candy-button:focus-visible{opacity:.82;background:#ffffff0a;box-shadow:none}.candy-button .mickey-mark{transform:scale(.72)}.candy-button:focus-visible{outline-color:#f5a34b99}.candy-control,.candy-hint{display:none}
.waterslide{position:absolute;z-index:0;top:0;left:0;width:100%;height:150px;pointer-events:none;opacity:.24}.waterslide .tube{fill:none;stroke:#f28a36;stroke-width:7;stroke-linecap:round;filter:drop-shadow(0 0 6px #f28a3640)}.waterslide .shine{fill:none;stroke:#ffd08a;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:3 12;opacity:.55}.waterslide .splash{fill:#f28a36;opacity:.55}.raft-riders{offset-path:path('M -25 92 C 85 24 205 18 294 60 S 466 126 605 42 C 642 20 674 18 725 38');offset-rotate:auto;offset-distance:0%;filter:drop-shadow(0 2px 3px #0008)}.raft{fill:#f28a36}.rider{fill:#ffd08a}.content>*:not(.waterslide){position:relative;z-index:1}@media(prefers-reduced-motion:no-preference){.raft-riders{animation:ride-the-slide 11s linear infinite}@keyframes ride-the-slide{0%{offset-distance:0%;opacity:0}5%,92%{opacity:.8}100%{offset-distance:100%;opacity:0}}}@media(prefers-reduced-motion:reduce){.raft-riders{offset-distance:58%;opacity:.55}}@media(max-width:760px){.waterslide{height:125px;opacity:.2}}
</style>
</head>
<body>
<main>
<section class="content" aria-labelledby="title">
<svg class="waterslide" viewBox="0 0 700 150" preserveAspectRatio="none" aria-hidden="true"><path class="tube" d="M-25 92 C85 24 205 18 294 60 S466 126 605 42 C642 20 674 18 725 38"/><path class="shine" d="M-25 88 C85 20 205 14 297 56 S466 118 602 37 C640 15 675 14 725 34"/><circle class="splash" cx="615" cy="36" r="4"/><circle class="splash" cx="626" cy="28" r="2.5"/><circle class="splash" cx="632" cy="42" r="2"/><g class="raft-riders"><path class="raft" d="M-13 1 Q0 8 13 1 L9 7 Q0 12-9 7Z"/><circle class="rider" cx="-5" cy="-5" r="3.5"/><circle class="rider" cx="4" cy="-7" r="3.5"/><path class="rider" d="M-8-2 L-7 3 M2-4 L3 2" stroke="#ffd08a" stroke-width="3" stroke-linecap="round"/></g></svg>
<p class="eyebrow">Welcome Jones Family</p><div class="rule" aria-hidden="true"></div>
<h1 class="event-title" id="title"><span class="event-lead">Halloween on the</span><span class="high-seas-line"><em>High Seas</em><button class="candy-button" id="candy-button" type="button" aria-label="Mickey surprise"><span class="mickey-mark" aria-hidden="true"><span></span></span></button></span></h1>
<p class="date">Setting sail October 8, 2026</p>
<div class="countdown" role="timer" aria-label="Time until cruise day">
<div><span class="number" id="days">—</span><span class="label">Days</span></div>
<div><span class="number" id="hours">—</span><span class="label">Hours</span></div>
<div><span class="number" id="minutes">—</span><span class="label">Minutes</span></div>
<div><span class="number" id="seconds">—</span><span class="label">Seconds</span></div>
</div>
<p id="status" role="status"></p>
<a class="magic-link" href="https://disneycruise.disney.go.com/specialty-cruises/halloween-on-the-high-seas/" target="_blank" rel="noopener noreferrer" aria-label="Explore Halloween on the High Seas on the official Disney Cruise Line website">
<span class="mickey-mark" aria-hidden="true"><span></span></span>
<span class="magic-copy">Explore Halloween on the High Seas<small>Official Disney Cruise Line page</small></span>
<span class="magic-arrow" aria-hidden="true">→</span>
</a>
<p class="note">Counting down to costumes, candy, and magic at sea · Midnight, Eastern time</p>
<noscript><p>Our cruise begins October 8, 2026. Enable JavaScript to see the live countdown.</p></noscript>
</section>
<aside class="photo" aria-label="Disney cruise ship photograph">
<img src="halloween-high-seas.png" alt="A festive Halloween cruise ship sailing beneath a glowing full moon" fetchpriority="high">
<div class="caption">Halloween magic awaits on the high seas</div>
</aside>
</main>
<script>
// October 8, 2026 at midnight in America/New_York (UTC−04:00).
const departure = Date.parse('2026-10-08T00:00:00-04:00');
function remaining(now) {
  const total = Math.max(0, Math.floor((departure - now) / 1000));
  return [Math.floor(total / 86400), Math.floor(total / 3600) % 24, Math.floor(total / 60) % 60, total % 60];
}
function updateCountdown() {
  const now = Date.now();
  remaining(now).forEach((value, index) => {
    document.getElementById(['days', 'hours', 'minutes', 'seconds'][index]).textContent = String(value).padStart(2, '0');
  });
  if (now >= departure) {
    document.getElementById('status').textContent = 'Cruise day is here. Let the magic begin!';
    clearInterval(ticker);
  }
}
const ticker = setInterval(updateCountdown, 1000);
updateCountdown();
const candyButton = document.getElementById('candy-button');
const candyPieces = ['🍬', '🍭', '🍫', '🍪', '🍬'];
candyButton.addEventListener('click', () => {
  const available = Math.max(0, 36 - document.querySelectorAll('.falling-candy').length);
  const amount = Math.min(24, available);
  for (let i = 0; i < amount; i += 1) {
    setTimeout(() => {
      const candy = document.createElement('span');
      candy.className = 'falling-candy';
      candy.textContent = candyPieces[Math.floor(Math.random() * candyPieces.length)];
      candy.style.left = `${Math.random() * 96}%`;
      candy.style.fontSize = `${1.25 + Math.random() * 1.35}rem`;
      candy.style.animationDuration = `${2.8 + Math.random() * 2}s`;
      candy.style.setProperty('--drift', `${-80 + Math.random() * 160}px`);
      candy.style.setProperty('--spin', `${-240 + Math.random() * 480}deg`);
      document.body.appendChild(candy);
      candy.addEventListener('animationend', () => candy.remove(), {once: true});
    }, i * 65);
  }
});
</script>
</body>
</html>
