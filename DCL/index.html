<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071e35">
<meta name="description" content="Counting down to our Disney cruise on October 8, 2026.">
<title>Our Disney Cruise Countdown</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#071e35;color:#fff}*{box-sizing:border-box}body{margin:0;min-height:100svh}main{min-height:100svh;display:grid;grid-template-columns:1fr 1fr}.content{padding:clamp(28px,6vw,100px);display:flex;flex-direction:column;justify-content:center}.eyebrow{color:#e9c77c;text-transform:uppercase;letter-spacing:.22em;font-weight:650;font-size:.875rem;margin:0 0 28px}.rule{width:52px;height:3px;background:#e9c77c;margin-bottom:32px}h1{font-family:Georgia,serif;font-size:clamp(3rem,6vw,6rem);line-height:1.04;font-weight:400;margin:0 0 24px;letter-spacing:-.035em}h1 em{color:#e9c77c;font-weight:400}.date{font-size:1.125rem;color:#d4e1eb;margin:0 0 44px}.countdown{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;border-block:1px solid #ffffff30;padding:24px 0}.number{display:block;font-size:clamp(1.85rem,3.8vw,3.8rem);font-weight:300;font-variant-numeric:tabular-nums;line-height:1.2}.label{display:block;font-size:.875rem;color:#bccedb;margin-top:8px}.note{font-size:.875rem;color:#bccedb;line-height:1.6;margin:22px 0 0}.photo{position:relative;min-height:480px;overflow:hidden;background:#125c83}.photo img{width:100%;height:100%;position:absolute;object-fit:cover;object-position:48% center}.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#071e3500 60%,#071e35c9)}.caption{position:absolute;bottom:34px;left:30px;right:30px;z-index:1;font-size:.8rem;line-height:1.6;color:white;text-shadow:0 1px 4px #000}.caption a{color:inherit;text-underline-offset:3px}#status{color:#e9c77c;font-size:1.125rem;margin-top:24px}#status:empty{display:none}@media(max-width:760px){main{grid-template-columns:1fr}.content{padding:48px 28px}.photo{min-height:340px;order:2}h1{font-size:clamp(3.2rem,12vw,5.5rem)}.number{font-size:clamp(2rem,8vw,3.8rem)}.date{margin-bottom:30px}.caption{bottom:20px;left:20px;right:20px}}@media(prefers-reduced-motion:no-preference){.content{animation:arrive .7s ease-out}@keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}}
</style>
</head>
<body>
<main>
<section class="content" aria-labelledby="title">
<p class="eyebrow">Welcome Jones Family</p><div class="rule" aria-hidden="true"></div>
<h1 id="title">Our Disney<br>cruise <em>awaits.</em></h1>
<p class="date">Setting sail October 8, 2026</p>
<div class="countdown" role="timer" aria-label="Time until cruise day">
<div><span class="number" id="days">—</span><span class="label">Days</span></div>
<div><span class="number" id="hours">—</span><span class="label">Hours</span></div>
<div><span class="number" id="minutes">—</span><span class="label">Minutes</span></div>
<div><span class="number" id="seconds">—</span><span class="label">Seconds</span></div>
</div>
<p id="status" role="status"></p>
<p class="note">Counting down to cruise day · Midnight, Eastern time</p>
<noscript><p>Our cruise begins October 8, 2026. Enable JavaScript to see the live countdown.</p></noscript>
</section>
<aside class="photo" aria-label="Disney cruise ship photograph">
<img src="https://upload.wikimedia.org/wikipedia/commons/d/d1/Disney_Dream_%28ship%2C_2011%29_001.jpg" alt="Disney Dream cruise ship at Port Canaveral" fetchpriority="high">
<div class="caption">Disney Dream pictured<br>Photo: <a href="https://commons.wikimedia.org/wiki/File:Disney_Dream_(ship,_2011)_001.jpg">ajmexico / Wikimedia Commons</a> · <a href="https://creativecommons.org/licenses/by/2.0/">CC BY 2.0</a> · Cropped</div>
</aside>
</main>
<script>
// October 8, 2026 at midnight in America/New_York (UTC−04:00).
const departure = Date.parse('2026-10-08T00:00:00-04:00');
function remaining(now) {
  const total = Math.max(0, Math.floor((departure - now) / 1000));
  return [Math.floor(total / 86400), Math.floor(total / 3600) % 24, Math.floor(total / 60) % 60, total % 60];
}
function updateCountdown() {
  const now = Date.now();
  remaining(now).forEach((value, index) => {
    document.getElementById(['days', 'hours', 'minutes', 'seconds'][index]).textContent = String(value).padStart(2, '0');
  });
  if (now >= departure) {
    document.getElementById('status').textContent = 'Cruise day is here. Let the magic begin!';
    clearInterval(ticker);
  }
}
const ticker = setInterval(updateCountdown, 1000);
updateCountdown();
</script>
</body>
</html>
